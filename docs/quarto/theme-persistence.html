<script>
(() => {
  if (window.location.protocol !== "file:") return;

  const storagePrefix = "amber-color-scheme:";
  const selectedScheme = () =>
    document.body.classList.contains("quarto-dark") ? "dark" : "light";

  const restoreScheme = () => {
    const saved = window.name.startsWith(storagePrefix)
      ? window.name.slice(storagePrefix.length)
      : null;
    if ((saved === "dark" || saved === "light") && saved !== selectedScheme()) {
      window.quartoToggleColorScheme?.();
    }
  };

  window.addEventListener("DOMContentLoaded", () => {
    // Run after Quarto has initialized its page-local color sentinel.
    window.setTimeout(restoreScheme, 0);

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".quarto-color-scheme-toggle")) return;
      // Quarto's inline handler runs first and updates the body class.
      window.setTimeout(() => {
        window.name = storagePrefix + selectedScheme();
      }, 0);
    });
  });
})();
</script>
